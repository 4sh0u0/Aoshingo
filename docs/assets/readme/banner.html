<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Aoshingo README banner</title>
<!--
  README のヘッダー画像（docs/assets/readme/banner.png）の元データ。
  1000×400 で表示し、デバイスピクセル比 2・背景透過で撮影して 2000×800 の PNG にする（角は透過）。
  配色は公式サイト（案 B「夜の交差点」）と同じ。フォントは Noto Sans JP（各自の環境にインストールしたもの）。
-->
<style>
  :root {
    --night: #0a1a3a;
    --night-glow: #1b4b8c;
    --text: #ffffff;
    --muted: #c5d0e2;
    --accent: #4be3c1;
    --signal-green: #00806b;
    --housing: #081226;
    --housing-stroke: #22345a;
    --red-off: #3a1517;
    --red-off-figure: #5c2326;
    --zebra: #e9eef6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 400px; }
  body {
    font-family: "Noto Sans JP Variable", "Noto Sans JP", "Hiragino Sans", sans-serif;
    color: var(--text);
    background: transparent;
    overflow: hidden;
  }
  .banner {
    position: relative;
    width: 1000px;
    height: 400px;
    border-radius: 20px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 620px 420px at 78% 62%, var(--night-glow) 0%, rgba(27, 75, 140, 0) 70%),
      linear-gradient(180deg, #0a1a3a 0%, #0d2149 100%);
  }
  .copy {
    position: absolute;
    left: 64px;
    top: 58px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .brand img {
    width: 48px;
    height: 48px;
  }
  .brand small {
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  h1 {
    margin-top: 34px;
    font-size: 60px;
    line-height: 1.18;
    font-weight: 900;
    letter-spacing: 0.01em;
  }
  h1 .accent {
    display: block;
    color: var(--accent);
    text-shadow: 0 0 28px rgba(75, 227, 193, 0.35);
  }
  .lead {
    margin-top: 22px;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* 信号灯 */
  .lamp {
    position: absolute;
    left: 700px;
    top: 34px;
    width: 156px;
    height: 296px;
    padding: 14px;
    border-radius: 36px;
    background: var(--housing);
    box-shadow: inset 0 0 0 2px var(--housing-stroke), 0 24px 60px rgba(0, 0, 0, 0.35);
    display: grid;
    gap: 12px;
  }
  .light {
    border-radius: 24px;
    display: grid;
    place-items: center;
  }
  .light svg { width: 74px; height: 74px; }
  .light.red { background: var(--red-off); color: var(--red-off-figure); }
  .light.green {
    background: var(--signal-green);
    color: #fff;
    box-shadow: 0 0 36px 6px rgba(75, 227, 193, 0.45), 0 0 90px 10px rgba(75, 227, 193, 0.18);
  }
  .waves {
    position: absolute;
    left: 868px;
    top: 74px;
    width: 64px;
    height: 110px;
    color: var(--accent);
    filter: drop-shadow(0 0 10px rgba(75, 227, 193, 0.55));
  }

  /* 横断歩道 */
  .zebra {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 30px;
    background: repeating-linear-gradient(90deg,
      var(--zebra) 0 56px,
      transparent 56px 112px);
    opacity: 0.92;
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-walk" viewBox="0 0 48 48">
      <circle cx="27" cy="8" r="4.5" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M25 16 21 29"/>
        <path d="M24 17l6 6 5 1"/>
        <path d="M24 17l-6 5-2 6"/>
        <path d="M21 29l7 6 1 9"/>
        <path d="M21 29l-4 7-6 6"/>
      </g>
    </symbol>
    <symbol id="i-stand" viewBox="0 0 48 48">
      <circle cx="24" cy="8" r="4.5" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 16v14"/>
        <path d="M24 17l-6 4-1 9"/>
        <path d="M24 17l6 4 1 9"/>
        <path d="M24 30l-4 13"/>
        <path d="M24 30l4 13"/>
      </g>
    </symbol>
  </svg>

  <div class="banner">
    <div class="copy">
      <div class="brand">
        <img src="../brand/aoshingo-icon.svg" alt="">
        <span>Aoshingo</span>
        <small>青信号</small>
      </div>
      <h1>歩行者用信号を、<span class="accent">手のひらに。</span></h1>
      <p class="lead">高度化PICS 対応・非公式・オープンソース</p>
    </div>

    <div class="lamp" aria-hidden="true">
      <div class="light red"><svg><use href="#i-stand"/></svg></div>
      <div class="light green"><svg><use href="#i-walk"/></svg></div>
    </div>

    <svg class="waves" viewBox="0 0 64 110" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round">
        <path d="M8 34a28 28 0 0 1 0 42"/>
        <path d="M26 18a50 50 0 0 1 0 74"/>
      </g>
    </svg>

    <div class="zebra"></div>
  </div>
</body>
</html>
