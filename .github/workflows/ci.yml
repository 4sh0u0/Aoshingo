name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: Swift package (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/AoshingoKit

  ios:
    name: iOS app (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest release Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: swift test (macOS)
        run: swift test --package-path Packages/AoshingoKit
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Aoshingo.xcodeproj \
            -scheme Aoshingo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
