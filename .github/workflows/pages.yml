name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # Every pull request runs this workflow, because the ruleset for main requires the
  # 「Website gate」check and a workflow skipped by a path filter never reports it (the merge would
  # wait forever). The `changes` job skips the checks when nothing under the paths above changed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their own older runs; deployments to Pages queue up and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-{0}', github.ref) || 'website-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pushes to main are already filtered by `paths`; a manual run always checks.
          if [ "$EVENT" != pull_request ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          printf '%s\n' "$files"
          # The same paths as `paths` above.
          if grep -qE '^site/|^\.github/workflows/pages\.yml$' <<<"$files"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check and build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: HTML, accessibility, links and external requests
        run: npm run check
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  # The Worker behind the 「メールアドレスを表示」 button. Cloudflare Workers Builds deploys it (see
  # site/contact-worker/README.md); this job tests it and builds it with the deploy configuration.
  contact-worker:
    name: Test the contact Worker
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site/contact-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/contact-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Validates cloudflare.config.ts and bundles the Worker as `cf deploy` would, without
      # credentials or an upload, so a configuration error shows here and not after the merge.
      - name: Build with the deploy configuration (no upload)
        run: npm run build

  # The only check of this workflow that the ruleset for main requires. A job skipped by its `if:`
  # counts as passed, so this job always runs and fails when any check above failed or was
  # cancelled. The deployment is not included: it runs only after a push to main.
  gate:
    name: Website gate
    needs: [changes, check, contact-worker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
